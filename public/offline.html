<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#B91C1C" />
    <title>Offline — FSIMS</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: rgba(148, 163, 184, 0.25);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --primary: #b91c1c;
        --primary-soft: rgba(185, 28, 28, 0.15);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2rem 1.5rem;
      }
      .icon {
        display: inline-grid;
        place-items: center;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 9999px;
        background: var(--primary-soft);
        color: #f87171;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.55;
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      button,
      a.button {
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border-radius: 0.625rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .retry {
        border: 0;
        background: var(--primary);
        color: #fff;
      }
      .home {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
      }
      .status {
        margin-top: 1.25rem;
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="icon" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="2" y1="2" x2="22" y2="22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M5 12.55a11 11 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M16.85 11.25a10.95 10.95 0 0 1 2.16 1.31" />
          <path d="M12 20h.01" />
        </svg>
      </span>
      <h1>You're offline</h1>
      <p>
        This screen hasn't been opened on this device yet, so it can't load without a connection.
        Screens you've already visited still work, and everything you saved is safe. Records can't
        be saved until you're back online.
      </p>
      <div class="actions">
        <button type="button" class="retry" id="retry">Try again</button>
        <a class="button home" href="/">Go to dashboard</a>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      var params = new URLSearchParams(location.search);
      var back = params.get("from") || "/";
      document.getElementById("retry").addEventListener("click", function () {
        if (navigator.onLine) {
          location.replace(back);
        } else {
          document.getElementById("status").textContent = "Still offline — try again once you have signal.";
        }
      });
      window.addEventListener("online", function () {
        location.replace(back);
      });
    </script>
  </body>
</html>
